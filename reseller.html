<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Program Kemitraan Reseller Marketing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #F9F6FC;
            --text-dark: #4A405A;
            --text-muted: #8B839B;
            --accent-light: #E8DEFA;
            --accent-main: #B59FDC;
            --accent-dark: #8F76BE;
            --accent-pink: #F3C8D9;
            --card-bg: rgba(255, 255, 255, 0.65);
        }

        body {
            font-family: 'Lora', serif;
            color: var(--text-dark);
            min-height: 100vh;
            background-color: var(--bg-base);
            background-image: radial-gradient(var(--accent-light) 1px, transparent 1px), radial-gradient(var(--accent-light) 1px, var(--bg-base) 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            background-attachment: fixed;
            position: relative;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, .font-heading { font-family: 'Playfair Display', serif; }

        .elegant-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            box-shadow: 0 10px 40px -10px rgba(181, 159, 220, 0.2);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .elegant-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-main);
            box-shadow: 0 15px 50px -10px rgba(181, 159, 220, 0.35);
        }

        .text-purple-gradient {
            background: linear-gradient(135deg, var(--accent-main) 0%, var(--accent-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .organic-shape {
            position: absolute;
            background: linear-gradient(135deg, rgba(181, 159, 220, 0.4) 0%, rgba(243, 200, 217, 0.4) 100%);
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            filter: blur(45px);
            z-index: -1;
            animation: morph 15s ease-in-out infinite alternate;
        }

        .shape-1 { top: 5%; left: -15%; width: 400px; height: 400px; }
        .shape-2 { bottom: 10%; right: -10%; width: 500px; height: 500px; animation-delay: -5s; }
        .shape-3 { top: 40%; left: 30%; width: 300px; height: 300px; background: linear-gradient(135deg, rgba(243, 200, 217, 0.3) 0%, rgba(181, 159, 220, 0.2) 100%); animation-delay: -2s;}

        @keyframes morph {
            0% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; transform: rotate(0deg) scale(1); }
            100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; transform: rotate(10deg) scale(1.1); }
        }

        .fade-in { animation: fadeIn 1s ease-out forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .chart-container { position: relative; width: 100%; height: 250px; }
        @media (min-width: 768px) { .chart-container { height: 320px; } }

        .elegant-input { background: rgba(255, 255, 255, 0.6); border: 2px solid var(--accent-light); color: var(--text-dark); font-size: 16px; }
        .elegant-input:focus { border-color: var(--accent-main); background: rgba(255, 255, 255, 0.9); box-shadow: 0 0 0 4px rgba(181, 159, 220, 0.15); outline: none; }

        .floating-wa {
            position: fixed; bottom: 24px; right: 24px; background: linear-gradient(135deg, #25D366, #128C7E); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4); z-index: 1000; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); animation: pulse-wa 2s infinite;
        }
        @keyframes pulse-wa { 0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.5); } 70% { box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); } 100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); } }

        .faq-answer { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out, padding 0.4s ease; }
        .faq-item.active .faq-answer { max-height: 200px; padding-bottom: 1rem; }
        
        .tier-card { position: relative; overflow: hidden; }
        .tier-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--tier-color); }
        .tier-silver { --tier-color: #E2E8F0; }
        .tier-gold { --tier-color: #FEF08A; }
        .tier-platinum { --tier-color: #E9D5FF; }
    </style>
</head>
<body class="antialiased selection:bg-[var(--accent-light)] selection:text-[var(--accent-dark)]">

    <div class="organic-shape shape-1"></div>
    <div class="organic-shape shape-2"></div>
    <div class="organic-shape shape-3"></div>

    <nav class="elegant-card sticky top-4 z-50 mx-4 md:mx-auto max-w-7xl px-5 md:px-6 py-3 md:py-4 rounded-full mt-4 flex justify-center md:justify-between items-center">
        <!-- Logo Bunga Cerita yang bisa diklik -->
        <a href="https://bungacerita-one.vercel.app/" class="text-2xl md:text-3xl font-bold font-heading text-purple-gradient italic tracking-wide hover:opacity-80 transition-opacity">Bunga Cerita</a>
        
        <div class="hidden md:flex space-x-8 items-center">
            <a href="#tugas" class="text-sm font-semibold text-[var(--text-muted)] hover:text-[var(--accent-dark)] transition-colors">Peran Mitra</a>
            <a href="#kalkulator" class="text-sm font-semibold text-[var(--text-muted)] hover:text-[var(--accent-dark)] transition-colors">Simulasi</a>
            <a href="#alur" class="text-sm font-semibold text-[var(--text-muted)] hover:text-[var(--accent-dark)] transition-colors">Alur Kerja</a>
            <a href="#benefit" class="px-6 py-2 rounded-full bg-[var(--accent-main)] text-white text-sm font-semibold hover:bg-[var(--accent-dark)] transition-all shadow-md">Keuntungan</a>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 md:px-6 py-12 md:py-16 relative z-10">
        <!-- (Section lainnya tetap sama seperti kode Anda sebelumnya) -->
        <section class="text-center mb-16 md:mb-24 fade-in">
            <h1 class="text-4xl md:text-5xl font-bold mb-6 text-[var(--text-dark)]">Program Kemitraan <br/> <span class="text-purple-gradient italic">Reseller Eksklusif</span></h1>
            <p class="text-base md:text-lg text-[var(--text-muted)] max-w-2xl mx-auto">Membangun kemandirian finansial melalui sistem kemitraan yang transparan.</p>
        </section>
        <!-- Tambahkan sisa section sesuai kode asli Anda di sini -->
    </main>

        // Fungsi JS Anda tetap sama seperti yang sebelumnya
        function initChart() { /* ... */ }
        function calculate() { /* ... */ }
        function toggleFaq(element) { /* ... */ }
        window.onload = function() { initChart(); calculate(); };
    </script>
</body>
</html>
